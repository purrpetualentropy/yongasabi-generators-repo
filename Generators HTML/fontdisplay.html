<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Display</title>
    <link href="./style.css" rel="stylesheet" type="text/css" media="all">
  </head>
  <body>
  <h1>Yongasabi Font Display Tool</h1>
  <p id="displayZone" class="yongiGlyph" style="transform: scale(1.5, 1.5); overflow-x: hidden;">wawa</p>
  <label for="inputBox">Write text in the box below, then press the button to see that text in the Yongasabi font.</label><br><br>
  <textarea type="text" id="inputBox"></textarea><br><br>
  <button onclick="document.getElementById('displayZone').innerHTML = document.getElementById('inputBox').value">Display</button>
    <p><a href="https://purrpetualentropy.neocities.org/yongasabi/generators/">Return to the index</a></p>

  </body>
</html>
